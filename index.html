    <meta charset="UTF-8" />

    <link rel="icon" href="./icone.svg" type="image/svg+xml" />

      content="Engenharia de Redes de Comunicação na UnB, com foco em dados e machine learning."
    />
    <meta property="og:url" content="https://victorhugoguimaraes.github.io/portfolio/" />
    <script>
      // Evita o flash de tema errado antes do React montar.
      // Aceita ?tema=escuro para link direto em um tema específico.
      (function () {
        try {
          var daUrl = new URLSearchParams(location.search).get('tema')
          var escolhido = daUrl || localStorage.getItem('tema')
          if (escolhido === 'escuro') document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
